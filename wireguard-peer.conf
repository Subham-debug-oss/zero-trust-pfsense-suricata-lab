# WireGuard client config template for an admin device
# Generate keys on the client:  wg genkey | tee private.key | wg pubkey > public.key
# Put the client PUBLIC key in the pfSense peer entry; never share the private key.

[Interface]
PrivateKey = <CLIENT_PRIVATE_KEY>
Address = 10.99.0.2/32
DNS = 10.0.99.1

[Peer]
# pfSense WireGuard tunnel public key (VPN > WireGuard > Tunnels)
PublicKey = <PFSENSE_TUNNEL_PUBLIC_KEY>
# Optional but recommended: preshared key adds a post-quantum-resistant layer
# PresharedKey = <PRESHARED_KEY>
Endpoint = <PFSENSE_WAN_IP_OR_DDNS>:51820
# Only route management and server networks through the tunnel (split tunnel)
AllowedIPs = 10.0.99.0/24, 10.0.20.0/24, 10.99.0.0/24
PersistentKeepalive = 25
